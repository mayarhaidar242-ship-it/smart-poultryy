name: Build APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    name: Build Debug APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Find and extract Android project ZIP
        shell: bash
        run: |
          set -euo pipefail
          ZIP_FILE="$(find . -maxdepth 1 -type f -iname '*.zip' -print -quit)"
          if [ -z "$ZIP_FILE" ]; then
            echo "::error::Upload the Android project ZIP to the repository root first."
            exit 1
          fi
          mkdir -p project-src
          unzip -oq "$ZIP_FILE" -d project-src
          if [ ! -f project-src/settings.gradle.kts ] || [ ! -d project-src/app ]; then
            echo "::error::The uploaded ZIP must contain settings.gradle.kts and app/ at its root."
            find project-src -maxdepth 3 -type f | head -80
            exit 1
          fi

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Build Debug APK
        working-directory: project-src
        shell: bash
        run: |
          mkdir -p app/schemas
          gradle :app:assembleDebug --stacktrace --no-daemon

      - name: Upload Debug APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: HPS-Lmar-debug-APK
          path: project-src/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 30
